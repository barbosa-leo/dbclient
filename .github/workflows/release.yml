name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./desktop/macos/build.sh

      - name: Rename artifact
        run: mv desktop/macos/build/DBClient-*.dmg DBClient-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: DBClient-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/windows/go.mod
          cache-dependency-path: |
            backend/go.sum
            desktop/windows/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./desktop/windows/build.sh

      - name: Rename artifact
        run: mv desktop/windows/build/DBClient-Setup-*.exe DBClient-Windows-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: DBClient-Windows-Setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            DBClient-macOS.dmg DBClient-Windows-Setup.exe

name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version="$(jq -r .version frontend/package.json)"
          if [[ "$package_version" != "${TAG#v}" ]]; then
            echo "::error::frontend/package.json está na versão $package_version, mas a tag é $TAG"
            exit 1
          fi

      # The app parses this Markdown back into categories (frontend/src/services/githubReleases.ts).
      - name: Render notes from releases.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq -r --arg version "${TAG#v}" '
            (map(select(.version == $version)) | first // error("releases.json não tem a versão \($version)")) as $release
            | [["new", "Novo"], ["improved", "Melhorias"], ["fixed", "Correções"]]
            | map(select(($release.changes[.[0]] // []) | length > 0)
                | "### \(.[1])\n\n" + ($release.changes[.[0]] | map("- " + .) | join("\n")))
            | join("\n\n")
          ' frontend/src/components/updates/releases.json > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload notes
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    needs: notes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./desktop/macos/build.sh

      - name: Rename artifact
        run: mv desktop/macos/build/DBClient-*.dmg DBClient-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: DBClient-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: ubuntu-latest
    needs: notes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/windows/go.mod
          cache-dependency-path: |
            backend/go.sum
            desktop/windows/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./desktop/windows/build.sh

      - name: Rename artifact
        run: mv desktop/windows/build/DBClient-Setup-*.exe DBClient-Windows-Setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: DBClient-Windows-Setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [notes, macos, windows]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            DBClient-macOS.dmg DBClient-Windows-Setup.exe
